name: Test

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        run: zig fmt --check .
      - name: Test (Debug)
        run: zig build test --summary all
      - name: Test (ReleaseSafe)
        run: zig build test -Doptimize=ReleaseSafe --summary all
      - name: Benchmark
        if: matrix.os == 'ubuntu-latest'
        run: zig build bench
